plugins {
  id "java"
}

dependencies {
  testImplementation("org.testcontainers:testcontainers:2.0.5")
  testImplementation("com.fasterxml.jackson.core:jackson-databind:2.23.0")
  testImplementation("com.google.protobuf:protobuf-java-util:4.36.2")
  testImplementation("com.squareup.okhttp3:okhttp:5.5.1")
  testImplementation("io.opentelemetry.proto:opentelemetry-proto:1.11.1-alpha")
  testImplementation("io.opentelemetry:opentelemetry-api")

  testImplementation("ch.qos.logback:logback-classic:1.6.8")
}

tasks.test {
  useJUnitPlatform()

  testLogging.showStandardStreams = true

  def shadowTask = project(":agent").tasks.shadowJar
  dependsOn(shadowTask)
  inputs.files(layout.files(shadowTask))
  mustRunAfter(":smoke-tests-images:http4s:jibDockerBuild")

  // The target image is external to the test JVM's classpath. Track its content as well as
  // the lane selectors so rebuilding an image or switching lanes invalidates test results.
  inputs.files(project(":smoke-tests-images:http4s").layout.buildDirectory.file("jib-image.id"))
      .withPropertyName("targetImageId")
      .withPathSensitivity(PathSensitivity.NONE)
  ["SMOKE_TEST_JAVA_VERSION": "11", "SMOKE_TEST_SCALA_VERSION": "3",
   "SMOKE_TEST_OTEL4S_VERSION": "latest", "SMOKE_TEST_CATS_EFFECT_VERSION": "latest"].each { key, fallback ->
    inputs.property(key, providers.environmentVariable(key).getOrElse(fallback))
  }

  doFirst {
    jvmArgs("-Dio.opentelemetry.smoketest.agent.shadowJar.path=${shadowTask.archiveFile.get()}")
  }
}
