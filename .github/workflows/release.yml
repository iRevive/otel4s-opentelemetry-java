name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle and run build
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: "true"

      - name: Verify release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          build_version="$(./gradlew -q :properties --console=plain | sed -n 's/^version: //p')"
          if [[ "$build_version" != "$release_version" ]]; then
            echo "Tag version '$release_version' does not match build version '$build_version'" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
        run: ./gradlew assemble publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Attach agent jar
        uses: softprops/action-gh-release@v3
        with:
          files: agent/build/libs/agent-${{ env.RELEASE_VERSION }}.jar
          prerelease: ${{ contains(github.ref_name, '-') }}
